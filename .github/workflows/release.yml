name: Release

# A pushed version tag: build the source archive and the SBOM of the runtime dependencies, attest both (provenance, signed by
# GitHub's OIDC identity; verify with `gh attestation verify <file> --repo slimfony/core`) and attach them to the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # attach the files to the release
      id-token: write     # the signing identity of the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: Source archive
        run: git archive --format=zip --prefix="core-${GITHUB_REF_NAME}/" -o "slimfony-core-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
      - name: Runtime dependencies (the SBOM lists what a user of the library installs)
        run: composer update --no-dev --no-interaction --prefer-dist
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            slimfony-core-*.zip
            sbom.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See the [CHANGELOG](CHANGELOG.md)."
          gh release upload "$GITHUB_REF_NAME" "slimfony-core-${GITHUB_REF_NAME}.zip" sbom.cdx.json --clobber
