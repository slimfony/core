name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slimfony_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: pdo-pgsql://postgres:postgres@127.0.0.1:5432/slimfony_test
    steps:
      # ponytail: pin actions to commit SHAs before v0.1.0 (supply chain)
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, ctype, mbstring, pdo_pgsql, pdo_sqlite
          ini-values: apc.enable_cli=1
          coverage: none
      - name: Composer cache dir
        id: cc
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cc.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer audit
      - run: composer ci
